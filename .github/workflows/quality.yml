name: Academy quality checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  academy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: academy/package-lock.json

      - name: Install locked Academy dependencies
        run: npm ci

      - name: Verify Purple Team visual integration
        run: npm run verify:purple-ui

      - name: Verify unit tests and simulation contracts
        run: npm run verify:all

      - name: Build Academy for /training/
        run: npm run build

      - name: Check release prerequisites
        run: npm run release:check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile Chromium
        run: npx playwright test --workers=1 --reporter=list --retries=0

      - name: Preserve validated Academy build
        uses: actions/upload-artifact@v4
        with:
          name: academy-dist
          path: academy/dist/
          if-no-files-found: error

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academy-browser-failures
          path: |
            academy/test-results/
            academy/playwright-report/
          if-no-files-found: ignore
