document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

4px; color:#5C6C82\">10.20.10.0/24<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#9DAEC2\">siem, sensors, dashboards, analyst workstations<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#9061F5\">static / reservation<\u002Fdiv>\n\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px\"><span style=\"color:#E14C5B; font-weight:700\">■ 30 RED<\u002Fspan><\u002Fdiv>\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#5C6C82\">10.30.10.0/24<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#9DAEC2\">attacker network — kali vms, red laptops, wi-fi clients via GE6<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#F3C032\">dhcp from opnsense<\u002Fdiv>\n\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px\"><span style=\"color:#9061F5; font-weight:700\">■ 40 VICTIMS<\u002Fspan><\u002Fdiv>\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#5C6C82\">10.40.10.0/24<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#9DAEC2\">vulnerable machines and challenge targets — dvwa, metasploitable, ctf clones<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#F3C032\">dhcp <span style=\"color:#5C6C82\">· static when flags reference an ip<\u002Fspan><\u002Fdiv>\n\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px\"><span style=\"color:#34C6DE; font-weight:700\">■ 50 OT/ICS<\u002Fspan><\u002Fdiv>\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#5C6C82\">10.50.10.0/24<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#9DAEC2\">industrial simulation — cybics, plc sim, hmi, modbus services<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#9061F5\">stati isplay:flex; align-items:center; gap:8px\"><div style=\"width:8px; height:8px; background:#8B9BB0\"><\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#B9C6D6\">QNAP NAS — SHARES<\u002Fdiv><\u002Fdiv>\n        <div style=\"margin-top:12px; font-size:11px; color:#9DAEC2\">\n          <div style=\"background:#0A101A; border:1px solid #1C2735; padding:8px 12px; margin-bottom:6px\">templates <span style=\"color:#5C6C82\">nfs<\u002Fspan><div style=\"color:#5C6C82; font-size:10px\">golden images shared by every proxmox node<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#0A101A; border:1px solid #1C2735; padding:8px 12px; margin-bottom:6px\">backups + isos <span style=\"color:#5C6C82\">nfs<\u002Fspan><div style=\"color:#5C6C82; font-size:10px\">vm backups · installer images<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#0A101A; border:1px solid #1C2735; padding:8px 12px\">sandbox artifacts <span style=\"color:#5C6C82\">nfs · write-once<\u002Fspan><div style=\"color:#5C6C82; font-size:10px\">samples in · reports + pcaps out<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:42px; display:flex; align-items:center; padding:0 4px\"><div style=\"position:relative; width:100%; height:1px; background:#243248\"><sc-if value=\"{{ animate }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:absolute; top:-2px; width:5px; height:5px; border-radius:50%; background:#8FA1B8; box-shadow:0 0 6px #8FA1B8; animation:pktXr 2s linear infinite\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1; border:1px solid #26344A; background:#0F1520; padding:16px 18px\">\n        <div style=\"display:flex; align-items:center; gap:8px\"><div style=\"width:8px; height:8px; background:#8B9BB0\"><\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#B9C6D6\">CONSUMERS<\u002Fdiv><\u002Fdiv>\n        <div style=\"margin-top:12px; font-size:11px; color:#9DAEC2\">\n          <div style=\"background:#0A101A; border:1px solid #1C2735; padding:8px 12px; margin-bottom:6px\">proxmox node 1 <span style=\"color:#5C6C82\">10.10.10.11<\u002Fspan><div style=\"color:#5C6C82; font-size:10px\">local ssd for hot vm disks · qnap for templates/backups<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#0A101A; border:1px solid #1C2735; padding:8px 12px; margin-bottom:6px\">future nodes 2…n<div style=\"color:#5C6C82; font-size:10px\">join cluster · same vmbr0 + trunk design · rule-based clone placement by free cpu/ram<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#0A101A; border:1px solid #1C2735; padding:8px 12px\">sandbox worker vm<div style=\"color:#5C6C82; font-size:10px\">reads samples · writes reports<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:42px\"><\u002Fdiv>\n      <div style=\"flex:1; border:1px solid #1C2735; background:#0E141D; padding:16px 18px\">\n        <div style=\"font-size:10px; letter-spacing:2px; color:#8FA1B8; font-weight:700; margin-bottom:12px\">OPTION TRADE-OFFS<\u002Fdiv>\n        <div style=\"font-size:11px; color:#9DAEC2; line-height:1.8\">\n          <div style=\"margin-bottom:8px\"><span style=\"color:#F3C032\">local ssd<\u002Fspan> <span style=\"color:#5C6C82\">— fastest for running labs; templates must be copied between nodes<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-bottom:8px\"><span style=\"color:#9061F5\">qnap nfs<\u002Fspan> <span style=\"color:#5C6C82\">— easy sharing; network becomes the bottleneck under heavy i/o<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-bottom:8px\"><span style=\"color:#9061F5\">qnap iscsi<\u002Fspan> <span style=\"color:#5C6C82\">— block storage for vm disks; more complex recovery<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#E14C5B\">usb<\u002Fspan> <span style=\"color:#5C6C82\">— bootstrap / emergency only<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 11 THREAT MODEL ============ -->\n  <div id=\"s11\" style=\"display:{{ h_s11 }}; align-items:center; gap:14px; margin:44px 0 20px\">\n    <div style=\"font-size:11px; font-weight:700; color:#F3C032\">11<\u002Fdiv>\n    <div style=\"font-size:12px; letter-spacing:3px; color:#8FA1B8; font-weight:700\">THREAT MODEL — WHAT IF<\u002Fdiv>\n    <div style=\"flex:1; height:1px; background:#1B2532\"><\u002Fdiv>\n    <div style=\"font-size:10px; color:#44536A\">assume breach · check the blast radius<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Threat model\" style=\"display:{{ c_s11 }}; grid-template-columns:1fr 1fr; gap:12px\">\n    <div style=\"border:1px solid #3A2326; background:#130D0E; padding:16px 18px\">\n      <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"font-size:10px; font-weight:700; color:#0A0D12; background:#E14C5B; padding:1px 7px\">IF<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#E14C5B\">the vps is compromised<\u002Fdiv><\u002Fdiv>\n      <div style=\"margin-top:10px; font-size:11px; color:#9DAEC2; line-height:1.8\"><span style=\"color:#F3C032\">contained:<\u002Fspan> no lab credentials live on the vps · the worker pulls jobs — nothing can push into the lab · wg peers stay pinned to single vlans<\u002Fdiv>\n      <div style=\"margin-top:6px; font-size:11px; color:#5C6C82; line-height:1.8\"><span style=\"color:#9061F5\">residual:<\u002Fspan> user data exposure + job-queue poisoning → the worker validates and allow-lists every job before acting on it<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #3A2326; background:#130D0E; padding:16px 18px\">\n      <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"font-size:10px; font-weight:700; color:#0A0D12; background:#E14C5B; padding:1px 7px\">IF<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#E14C5B\">a wireguard key is stolen<\u002Fdiv><\u002Fdiv>\n      <div style=\"margin-top:10px; font-size:11px; color:#9DAEC2; line-height:1.8\"><span style=\"color:#F3C032\">contained:<\u002Fspan> allowed-ips pins the peer to one subnet — cryptographically, not by ui · opnsense still default-denies cross-zone traffic<\u002Fdiv>\n      <div style=\"margin-top:6px; font-size:11px; color:#5C6C82; line-height:1.8\"><span style=\"color:#9061F5\">residual:<\u002Fspan> full access to that one vlan → short-lived keys for guests, per-peer logging, revoke = delete one peer<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #3A2326; background:#130D0E; padding:16px 18px\">\n      <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"font-size:10px; font-weight:700; color:#0A0D12; background:#E14C5B; padding:1px 7px\">IF<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#E14C5B\">a sample escapes the analysis vm<\u002Fdiv><\u002Fdiv>\n      <div style=\"margin-top:10px; font-size:11px; color:#9DAEC2; line-height:1.8\"><span style=\"color:#F3C032\">contained:<\u002Fspan> vlan 60 is default-deny · only egress is inetsim (61) · no real internet path exists from the malware zone<\u002Fdiv>\n      <div style=\"margin-top:6px; font-size:11px; color:#5C6C82; line-height:1.8\"><span style=\"color:#9061F5\">residual:<\u002Fspan> hypervisor escape or the qnap artifact share → patch proxmox promptly, disposable vms, mount the share write-once<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #3A2326; background:#130D0E; padding:16px 18px\">\n      <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"font-size:10px; font-weight:700; color:#0A0D12; background:#E14C5B; padding:1px 7px\">IF<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#E14C5B\">red team reaches mgmt<\u002Fdiv><\u002Fdiv>\n      <div style=\"margin-top:10px; font-size:11px; color:#9DAEC2; line-height:1.8\"><span style=\"color:#F3C032\">contained:<\u002Fspan> block-to-mgmt rule sits at the top of every non-mgmt vlan with logging on — a hit is an alert, not a mystery<\u002Fdiv>\n      <div style=\"margin-top:6px; font-size:11px; color:#5C6C82; line-height:1.8\"><span style=\"color:#9061F5\">residual:<\u002Fspan> switch or trunk misconfig → periodic audit of port modes, vlan membership, and firewall rule order<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 12 ZOOM-IN: SCHEDULER / NODE SELECTION ============ -->\n  <div id=\"s12\" style=\"display:{{ h_s12 }}; align-items:center; gap:14px; margin:44px 0 20px\">\n    <div style=\"font-size:11px; font-weight:700; color:#F3C032\">12<\u002Fdiv>\n    <div style=\"font-size:12px; letter-spacing:3px; color:#8FA1B8; font-weight:700\">ZOOM-IN — SCHEDULER · CHOOSING THE RIGHT NODE<\u002Fdiv>\n    <div style=\"flex:1; height:1px; background:#1B2532\"><\u002Fdiv>\n    <div style=\"font-size:10px; color:#44536A\">fastapi is the brain — it decides where each machine is born<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Scheduler / node selection zoom-in\" style=\"display:{{ c_s12 }}; border:1px solid #1C2735; background:rgba(14,20,29,0.85); padding:26px\">\n\n    <!-- decision pipeline -->\n    <div style=\"display:flex; align-items:stretch\">\n      <div style=\"flex:1; border:1px solid #26405C; background:#0D1622; padding:14px 16px\">\n        <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"font-size:10px; font-weight:700; color:#0A0D12; background:#F3C032; width:18px; height:18px; display:flex; align-items:center; justify-content:center\">1<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#88B4EE\">REQUEST<\u002Fdiv><div style=\"font-size:9px; letter-spacing:1px; color:#4F8FE0; border:1px solid #26405C; padding:1px 6px; margin-left:auto\">FASTAPI<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:10.5px; color:#5C6C82; margin-top:8px; line-height:1.7\">user asks to start lab X · request carries the template id, target vlan and the vm's cpu / ram / disk shape<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:38px; display:flex; align-items:center; padding:0 4px\"><div style=\"position:relative; width:100%; height:1px; background:#243248\"><sc-if value=\"{{ animate }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:absolute; top:-2px; width:5px; height:5px; border-radius:50%; background:#F3C032; box-shadow:0 0 6px #F3C032; animation:pktX 2s linear infinite\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1; border:1px solid #26344A; background:#0F1520; padding:14px 16px\">\n        <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"font-size:10px; font-weight:700; color:#0A0D12; background:#F3C032; width:18px; height:18px; display:flex; align-items:center; justify-content:center\">2<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#B9C6D6\">COLLECT METRICS<\u002Fdiv><div style=\"font-size:9px; letter-spacing:1px; color:#8FA1B8; border:1px solid #2A3648; padding:1px 6px; margin-left:auto\">CLUSTER API<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:10.5px; color:#5C6C82; margin-top:8px; line-height:1.7\">polls the proxmox cluster api — per node: status, free vcpu, free ram, load avg, running vms, free storage<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:38px; display:flex; align-items:center; padding:0 4px\"><div style=\"position:relative; width:100%; height:1px; background:#243248\"><sc-if value=\"{{ animate }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:absolute; top:-2px; width:5px; height:5px; border-radius:50%; background:#F3C032; box-shadow:0 0 6px #F3C032; animation:pktX 2s linear infinite; animation-delay:0.5s\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1; border:1px solid #3A2326; background:#130D0E; padding:14px 16px\">\n        <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"font-size:10px; font-weight:700; color:#0A0D12; background:#F3C032; width:18px; height:18px; display:flex; align-items:center; justify-content:center\">3<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#E14C5B\">FILTER<\u002Fdiv><div style=\"font-size:9px; letter-spacing:1px; color:#E14C5B; border:1px solid #3A2326; padding:1px 6px; margin-left:auto\">HARD RULES<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:10.5px; color:#5C6C82; margin-top:8px; line-height:1.7\">drop every node that can't host it — offline / maintenance, too little free ram or vcpu, missing template, wrong tag<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:38px; display:flex; align-items:center; padding:0 4px\"><div style=\"position:relative; width:100%; height:1px; background:#243248\"><sc-if value=\"{{ animate }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:absolute; top:-2px; width:5px; height:5px; border-radius:50%; background:#F3C032; box-shadow:0 0 6px #F3C032; animation:pktX 2s linear infinite; animation-delay:1s\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1; border:1px solid #4A3A12; background:#1A1405; padding:14px 16px\">\n        <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"font-size:10px; font-weight:700; color:#0A0D12; background:#F3C032; width:18px; height:18px; display:flex; align-items:center; justify-content:center\">4<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#F3C032\">SCORE<\u002Fdiv><div style=\"font-size:9px; letter-spacing:1px; color:#F3C032; border:1px solid #4A3A12; padding:1px 6px; margin-left:auto\">WEIGHTED<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:10.5px; color:#5C6C82; margin-top:8px; line-height:1.7\">rank the survivors with a weighted fit score — the most headroom, and a template already local, wins<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:38px; display:flex; align-items:center; padding:0 4px\"><div style=\"position:relative; width:100%; height:1px; background:#243248\"><sc-if value=\"{{ animate }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:absolute; top:-2px; width:5px; height:5px; border-radius:50%; background:#F3C032; box-shadow:0 0 6px #F3C032; animation:pktX 2s linear infinite; animation-delay:1.5s\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1; border:1px solid #123B2E; background:#08130E; padding:14px 16px\">\n        <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"font-size:10px; font-weight:700; color:#0A0D12; background:#F3C032; width:18px; height:18px; display:flex; align-items:center; justify-content:center\">5<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#4FB88A\">PLACE + START<\u002Fdiv><div style=\"font-size:9px; letter-spacing:1px; color:#4FB88A; border:1px solid #123B2E; padding:1px 6px; margin-left:auto\">CLONE<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:10.5px; color:#5C6C82; margin-top:8px; line-height:1.7\">clone onto the winning node · set the vlan tag · start · on failure, fall back to the next-best node<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- filters + scoring -->\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:30px; margin-top:24px\">\n      <div>\n        <div style=\"font-size:10px; letter-spacing:2px; color:#8FA1B8; font-weight:700; margin-bottom:12px\">HARD FILTERS — a node must pass every one, or it's dropped<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #151D29; font-size:11.5px; color:#9DAEC2\"><span style=\"color:#F3C032; font-weight:700\">✓<\u002Fspan> node online &amp; out of maintenance<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #151D29; font-size:11.5px; color:#9DAEC2\"><span style=\"color:#F3C032; font-weight:700\">✓<\u002Fspan> free vRAM ≥ requested + safety reserve<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #151D29; font-size:11.5px; color:#9DAEC2\"><span style=\"color:#F3C032; font-weight:700\">✓<\u002Fspan> free vCPU ≥ requested cores<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #151D29; font-size:11.5px; color:#9DAEC2\"><span style=\"color:#F3C032; font-weight:700\">✓<\u002Fspan> template + target storage reachable from the node<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #151D29; font-size:11.5px; color:#9DAEC2\"><span style=\"color:#F3C032; font-weight:700\">✓<\u002Fspan> cluster tag matches (lab-capable) · not over its vm cap<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:10px; padding:7px 0; font-size:11.5px; color:#9DAEC2\"><span style=\"color:#E14C5B; font-weight:700\">✕<\u002Fspan> never a node that would place the clone on vlan 10 (mgmt)<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:10px; letter-spacing:2px; color:#8FA1B8; font-weight:700; margin-bottom:12px\">FIT SCORE — weighted (higher = better home)<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:11px\"><div style=\"width:180px; font-size:11px; color:#9DAEC2\">free RAM headroom<\u002Fdiv><div style=\"flex:1; height:9px; background:#0A101A; border:1px solid #1C2735\"><div style=\"width:40%; height:100%; background:#F3C032\"><\u002Fdiv><\u002Fdiv><div style=\"width:34px; text-align:right; font-size:11px; color:#F3C032; font-weight:700\">40%<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:11px\"><div style=\"width:180px; font-size:11px; color:#9DAEC2\">free vCPU / load average<\u002Fdiv><div style=\"flex:1; height:9px; background:#0A101A; border:1px solid #1C2735\"><div style=\"width:30%; height:100%; background:#F3C032\"><\u002Fdiv><\u002Fdiv><div style=\"width:34px; text-align:right; font-size:11px; color:#F3C032; font-weight:700\">30%<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:11px\"><div style=\"width:180px; font-size:11px; color:#9DAEC2\">spread — fewer running vms<\u002Fdiv><div style=\"flex:1; height:9px; background:#0A101A; border:1px solid #1C2735\"><div style=\"width:15%; height:100%; background:#F3C032\"><\u002Fdiv><\u002Fdiv><div style=\"width:34px; text-align:right; font-size:11px; color:#F3C032; font-weight:700\">15%<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:11px\"><div style=\"width:180px; font-size:11px; color:#9DAEC2\">template already local<\u002Fdiv><div style=\"flex:1; height:9px; background:#0A101A; border:1px solid #1C2735\"><div style=\"width:10%; height:100%; background:#F3C032\"><\u002Fdiv><\u002Fdiv><div style=\"width:34px; text-align:right; font-size:11px; color:#F3C032; font-weight:700\">10%<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:12px\"><div style=\"width:180px; font-size:11px; color:#9DAEC2\">node health / uptime<\u002Fdiv><div style=\"flex:1; height:9px; background:#0A101A; border:1px solid #1C2735\"><div style=\"width:5%; height:100%; background:#F3C032\"><\u002Fdiv><\u002Fdiv><div style=\"width:34px; text-align:right; font-size:11px; color:#F3C032; font-weight:700\">5%<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- worked example -->\n    <div style=\"margin-top:24px\">\n      <div style=\"font-size:10px; letter-spacing:2px; color:#8FA1B8; font-weight:700; margin-bottom:12px\">WORKED EXAMPLE — one clone, three candidate nodes<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1.3fr .9fr .9fr .7fr 1fr .9fr; border:1px solid #1C2735; font-size:11.5px\">\n        <div style=\"background:#0F1520; border-bottom:1px solid #26344A; padding:9px 14px; font-size:10px; letter-spacing:2px; color:#8FA1B8; font-weight:700\">NODE<\u002Fdiv>\n        <div style=\"background:#0F1520; border-bottom:1px solid #26344A; padding:9px 14px; font-size:10px; letter-spacing:2px; color:#8FA1B8; font-weight:700\">FREE vCPU<\u002Fdiv>\n        <div style=\"background:#0F1520; border-bottom:1px solid #26344A; padding:9px 14px; font-size:10px; letter-spacing:2px; color:#8FA1B8; font-weight:700\">FREE RAM<\u002Fdiv>\n        <div style=\"background:#0F1520; border-bottom:1px solid #26344A; padding:9px 14px; font-size:10px; letter-spacing:2px; color:#8FA1B8; font-weight:700\">VMs<\u002Fdiv>\n        <div style=\"background:#0F1520; border-bottom:1px solid #26344A; padding:9px 14px; font-size:10px; letter-spacing:2px; color:#8FA1B8; font-weight:700\">TEMPLATE<\u002Fdiv>\n        <div style=\"background:#0F1520; border-bottom:1px solid #26344A; padding:9px 14px; font-size:10px; letter-spacing:2px; color:#8FA1B8; font-weight:700\">SCORE<\u002Fdiv>\n\n        <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#B9C6D6; font-weight:700\">proxmox-1<\u002Fdiv>\n        <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#9DAEC2\">6<\u002Fdiv>\n        <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#9DAEC2\">18 GB<\u002Fdiv>\n        <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#9DAEC2\">9<\u002Fdiv>\n        <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#4FB88A\">local<\u002Fdiv>\n        <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; color:#5C6C82\">0.71<\u002Fdiv>\n\n        <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; background:#1A1405; color:#F3C032; font-weight:700\">proxmox-2 <span style=\"font-size:9.5px; color:#F3C032\">◄ PLACED<\u002Fspan><\u002Fdiv>\n        <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; background:#1A1405; color:#DCE6F2\">12<\u002Fdiv>\n        <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; background:#1A1405; color:#DCE6F2\">42 GB<\u002Fdiv>\n        <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; background:#1A1405; color:#DCE6F2\">3<\u002Fdiv>\n        <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; background:#1A1405; color:#4FB88A\">local<\u002Fdiv>\n        <div style=\"border-bottom:1px solid #151D29; padding:9px 14px; background:#1A1405; color:#F3C032; font-weight:700\">0.93<\u002Fdiv>\n\n        <div style=\"padding:9px 14px; color:#B9C6D6; font-weight:700\">proxmox-3<\u002Fdiv>\n        <div style=\"padding:9px 14px; color:#9DAEC2\">10<\u002Fdiv>\n        <div style=\"padding:9px 14px; color:#9DAEC2\">30 GB<\u002Fdiv>\n        <div style=\"padding:9px 14px; color:#9DAEC2\">5<\u002Fdiv>\n        <div style=\"padding:9px 14px; color:#E06B3C\">copy needed<\u002Fdiv>\n        <div style=\"padding:9px 14px; color:#5C6C82\">0.78<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:10.5px; color:#5C6C82; margin-top:8px\">proxmox-2 wins on headroom (most free ram + vcpu, fewest vms) and keeps the template local — no cross-node copy.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- rules strip -->\n    <div style=\"margin-top:22px; border-top:1px solid #1B2532; padding-top:14px; display:flex; gap:28px; font-size:10.5px; color:#5C6C82; flex-wrap:wrap\">\n      <span style=\"letter-spacing:2px; color:#8FA1B8; font-weight:700; font-size:10px\">SCHEDULER RULES<\u002Fspan>\n      <span><span style=\"color:#F3C032\">▪<\u002Fspan> deterministic tie-break by node id — same inputs, same choice<\u002Fspan>\n      <span><span style=\"color:#F3C032\">▪<\u002Fspan> refuses to place lab clones on vlan 10 (mgmt)<\u002Fspan>\n      <span><span style=\"color:#F3C032\">▪<\u002Fspan> retries the next-best node if a clone or start fails<\u002Fspan>\n      <span><span style=\"color:#F3C032\">▪<\u002Fspan> logs candidates, scores and the winner for every placement<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 13 ZOOM-IN: PCAP -> ELASTIC ============ -->\n  <div id=\"s13\" style=\"display:{{ h_s13 }}; align-items:center; gap:14px; margin:44px 0 20px\">\n    <div style=\"font-size:11px; font-weight:700; color:#F3C032\">13<\u002Fdiv>\n    <div style=\"font-size:12px; letter-spacing:3px; color:#8FA1B8; font-weight:700\">ZOOM-IN — PCAP → ELASTIC · BLUE-TEAM PIPELINE<\u002Fdiv>\n    <div style=\"flex:1; height:1px; background:#1B2532\"><\u002Fdiv>\n    <div style=\"font-size:10px; color:#44536A\">from wire capture to searchable dashboards<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"PCAP to Elastic zoom-in\" style=\"display:{{ c_s13 }}; border:1px solid #1C2735; background:rgba(14,20,29,0.85); padding:26px\">\n\n    <!-- row 1: capture in the lab (left to right) -->\n    <div style=\"display:flex; align-items:stretch\">\n      <div style=\"flex:1; border:1px solid #4A2A18; background:#140D08; padding:14px 16px\">\n        <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"font-size:10px; font-weight:700; color:#0A0D12; background:#F3C032; width:18px; height:18px; display:flex; align-items:center; justify-content:center\">1<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#E06B3C\">CAPTURE<\u002Fdiv><div style=\"font-size:9px; letter-spacing:1px; color:#E06B3C; border:1px solid #4A2A18; padding:1px 6px; margin-left:auto\">VLAN 60/61<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:10.5px; color:#5C6C82; margin-top:8px; line-height:1.7\">sensor nic on a mirror / span port sees all detonation traffic · tcpdump / zeek write rotating pcap · suricata reads the same wire live<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:42px; display:flex; align-items:center; padding:0 4px\"><div style=\"position:relative; width:100%; height:1px; background:#243248\"><sc-if value=\"{{ animate }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:absolute; top:-2px; width:5px; height:5px; border-radius:50%; background:#F3C032; box-shadow:0 0 6px #F3C032; animation:pktX 2s linear infinite\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1; border:1px solid #123B2E; background:#08130E; padding:14px 16px\">\n        <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"font-size:10px; font-weight:700; color:#0A0D12; background:#F3C032; width:18px; height:18px; display:flex; align-items:center; justify-content:center\">2<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#4FB88A\">EXTRACT<\u002Fdiv><div style=\"font-size:9px; letter-spacing:1px; color:#4FB88A; border:1px solid #123B2E; padding:1px 6px; margin-left:auto\">SENSOR<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:10.5px; color:#5C6C82; margin-top:8px; line-height:1.7\">zeek turns packets into logs — conn, dns, http, tls, files, x509, notice · suricata emits eve.json alerts · carved files hashed<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:42px; display:flex; align-items:center; padding:0 4px\"><div style=\"position:relative; width:100%; height:1px; background:#243248\"><sc-if value=\"{{ animate }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:absolute; top:-2px; width:5px; height:5px; border-radius:50%; background:#F3C032; box-shadow:0 0 6px #F3C032; animation:pktX 2s linear infinite; animation-delay:0.6s\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1; border:1px solid #26344A; background:#0F1520; padding:14px 16px\">\n        <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"font-size:10px; font-weight:700; color:#0A0D12; background:#F3C032; width:18px; height:18px; display:flex; align-items:center; justify-content:center\">3<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#B9C6D6\">SHIP<\u002Fdiv><div style=\"font-size:9px; letter-spacing:1px; color:#8FA1B8; border:1px solid #2A3648; padding:1px 6px; margin-left:auto\">BEATS<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:10.5px; color:#5C6C82; margin-top:8px; line-height:1.7\">elastic-agent / filebeat + ; color:#9061F5\">VICTIMS · VLAN 40 <span style=\"color:#5C6C82; font-weight:400\">10.40.10.0/24 · vulnerable targets<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:56px 62px 1.1fr 1.15fr 92px 50px 1.7fr\">\n        <div style=\"padding:8px 12px; font-size:11px; color:#F3C032; font-weight:700; border-bottom:1px solid #151D29\">✓ PASS<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2; border-bottom:1px solid #151D29\">any<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9061F5; border-bottom:1px solid #151D29\">VICTIMS net<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#4FB88A; border-bottom:1px solid #151D29\">INETSIM 10.60.20.0/24<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2; border-bottom:1px solid #151D29\">*<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#5C6C82; border-bottom:1px solid #151D29\">–<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:10.5px; color:#5C6C82; border-bottom:1px solid #151D29\">controlled fake-internet egress — no real WAN<\u002Fdiv>\n\n        <div style=\"padding:8px 12px; font-size:11px; color:#E14C5B; font-weight:700; border-bottom:1px solid #151D29\">✕ BLOCK<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2; border-bottom:1px solid #151D29\">any<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9061F5; border-bottom:1px solid #151D29\">VICTIMS net<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#8B9BB0; border-bottom:1px solid #151D29\">MGMT 10.10.10.0/24<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2; border-bottom:1px solid #151D29\">*<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#F3C032; border-bottom:1px solid #151D29\">on<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:10.5px; color:#5C6C82; border-bottom:1px solid #151D29\">a compromised target must not escalate into mgmt<\u002Fdiv>\n\n        <div style=\"padding:8px 12px; font-size:11px; color:#E14C5B; font-weight:700\">✕ BLOCK<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2\">any<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9061F5\">VICTIMS net<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2\">* any<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2\">*<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#F3C032\">on<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:10.5px; color:#5C6C82\">default deny — compromise stays put<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- MALWARE -->\n    <div style=\"border:1px solid #4A2A18\">\n      <div style=\"display:flex; align-items:center; gap:8px; padding:10px 14px; background:#140D08\">\n        <div style=\"width:8px; height:8px; background:#E06B3C\"><\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#E06B3C\">MALWARE · VLAN 60 <span style=\"color:#5C6C82; font-weight:400\">10.60.10.0/24 · contained detonation<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-left:auto; font-size:10px; color:#5C6C82\"><a href=\"#s05\" style=\"color:#44536A\">§05 sandbox<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:56px 62px 1.1fr 1.15fr 92px 50px 1.7fr\">\n        <div style=\"padding:8px 12px; font-size:11px; color:#F3C032; font-weight:700; border-bottom:1px solid #151D29\">✓ PASS<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2; border-bottom:1px solid #151D29\">any<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#E06B3C; border-bottom:1px solid #151D29\">MALWARE net<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#4FB88A; border-bottom:1px solid #151D29\">INETSIM 10.60.20.0/24<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2; border-bottom:1px solid #151D29\">*<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#F3C032; border-bottom:1px solid #151D29\">on<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:10.5px; color:#5C6C82; border-bottom:1px solid #151D29\">fake internet only — dns / http / smtp sinkhole<\u002Fdiv>\n\n        <div style=\"padding:8px 12px; font-size:11px; color:#E14C5B; font-weight:700; border-bottom:1px solid #151D29\">✕ BLOCK<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2; border-bottom:1px solid #151D29\">any<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#E06B3C; border-bottom:1px solid #151D29\">MALWARE net<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#DCE6F2; border-bottom:1px solid #151D29\">WAN / internet<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2; border-bottom:1px solid #151D29\">*<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#F3C032; border-bottom:1px solid #151D29\">on<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:10.5px; color:#5C6C82; border-bottom:1px solid #151D29\">no uncontrolled egress to the real internet, ever<\u002Fdiv>\n\n        <div style=\"padding:8px 12px; font-size:11px; color:#E14C5B; font-weight:700\">✕ BLOCK<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2\">any<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#E06B3C\">MALWARE net<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2\">* any<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#9DAEC2\">*<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:11px; color:#F3C032\">on<\u002Fdiv>\n        <div style=\"padding:8px 12px; font-size:10.5px; color:#5C6C82\">default deny — nothing else leaves the zone<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- eval notes -->\n    <div style=\"margin-top:22px; border-top:1px solid #1B2532; padding-top:14px; display:flex; gap:28px; font-size:10.5px; color:#5C6C82; flex-wrap:wrap\">\n      <span style=\"letter-spacing:2px; color:#8FA1B8; font-weight:700; font-size:10px\">HOW OPNSENSE EVALUATES<\u002Fspan>\n      <span><span style=\"color:#F3C032\">▪<\u002Fspan> rules run top-down — first match wins<\u002Fspan>\n      <span><span style=\"color:#F3C032\">▪<\u002Fspan> floating rules are checked before per-interface rules<\u002Fspan>\n      <span><span style=\"color:#F3C032\">▪<\u002Fspan> every zone ends in an explicit default-deny + log<\u002Fspan>\n      <span><span style=\"color:#F3C032\">▪<\u002Fspan> block rules use \"quick\" so they short-circuit<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:{{ c_open }}; margin-top:24px; border:1px dashed #362A5C; background:#100A1B; padding:14px 20px; gap:26px; font-size:10.5px; color:#5C6C82; flex-wrap:wrap; align-items:center\">\n    <span style=\"letter-spacing:2px; color:#9061F5; font-weight:700; font-size:10px\">OPEN ITEMS<\u002Fspan>\n    <span>▪ qnap switch port — assumed GE8 / vlan 10 · dedicated storage vlan instead?<\u002Fspan>\n    <span>▪ guest wireguard peers — assumed to land in vlan 40 · confirm the event access model<\u002Fspan>\n    <span>▪ sandbox queue + report format — beta · section <a href=\"#s05\" style=\"color:#9061F5\">05<\u002Fa> is a proposal<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:28px; font-size:10.5px; color:#44536A; text-align:center; letter-spacing:1px\">divd cyberlab · topology reflects operating guide v1.0 + web-access &amp; sandbox extension<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1560},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;presentMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showSandbox&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showPolicy&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = { flow: null, present: null, cur: 0 };\n  nodes = {};\n\n  isPresent() {\n    return this.state.present ?? (this.props.presentMode ?? false);\n  }\n\n  componentDidMount() {\n    this._onR = () => this.forceUpdate();\n    window.addEventListener('resize', this._onR);\n    this._onK = (e) => {\n      if (!this.isPresent()) return;\n      if (e.key === 'ArrowRight') this.setState(s => ({ cur: Math.min(s.cur + 1, 13), flow: null }));\n      if (e.key === 'ArrowLeft') this.setState(s => ({ cur: Math.max(s.cur - 1, 0), flow: null }));\n    };\n    window.addEventListener('keydown', this._onK);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onR);\n    window.removeEventListener('keydown', this._onK);\n  }\n\n  renderVals() {\n    const animate = this.props.animate ?? true;\n    const flowDefs = {\n      rv: [['red', 'victims', 1]],\n      rm: [['red', 'mgmt', 0]],\n      ro: [['red', 'ot', 1]],\n      vm: [['victims', 'mgmt', 0]],\n      mi: [['malware', 'inetsim', 1]],\n      mx: [['malware', 'internet', 0]],\n      bs: [['blue', 'victims', 1], ['blue', 'ot', 1], ['blue', 'malware', 1]],\n      wg: [['wg', 'mgmt', 1], ['wg', 'blue', 1], ['wg', 'red', 1], ['wg', 'victims', 1], ['wg', 'ot', 1], ['wg', 'malware', 1], ['wg', 'inetsim', 1]],\n    };\n    const zones = ['internet', 'vps', 'wg', 'mgmt', 'blue', 'red', 'victims', 'ot', 'malware', 'inetsim'];\n    const active = this.state.flow;\n    const pairs = active ? flowDefs[active] : null;\n    const involved = new Set();\n    if (pairs) for (const p of pairs) { involved.add(p[0]); involved.add(p[1]); }\n    if (active === 'wg') involved.add('vps');\n\n    const present = this.isPresent();\n    const cur = this.state.cur;\n    const sections = [\n      { id: 's01', h: 'flex', c: 'flex' },\n      { id: 's02', h: 'flex', c: 'block' },\n      { id: 's03', h: 'flex', c: 'block' },\n      { id: 's04', h: 'flex', c: 'block' },\n      { id: 's05', h: 'flex', c: 'block' },\n      { id: 's06', h: 'flex', c: 'block' },\n      { id: 's07', h: 'flex', c: 'block' },\n      { id: 's08', h: 'flex', c: 'block' },\n      { id: 's09', h: 'flex', c: 'block' },\n      { id: 's10', h: 'flex', c: 'block' },\n      { id: 's11', h: 'flex', c: 'grid' },\n      { id: 's12', h: 'flex', c: 'block' },\n      { id: 's13', h: 'flex', c: 'block' },\n      { id: 's14', h: 'flex', c: 'block' },\n    ];\n\n    const vals = {\n      animate,\n      present,\n      showSandbox: this.props.showSandbox ?? true,\n      showPolicy: this.props.showPolicy ?? true,\n      flowHint: active ? 'tracing on map — click again to clear' : 'click a flow to trace it on the map',\n      presentLabel: present ? 'EXIT' : 'PRESENT',\n      presentCounter: (cur + 1) + ' / 14',\n      togglePresent: () => this.setState({ present: !this.isPresent(), flow: null, cur: 0 }),\n      prevSection: () => this.setState(s => ({ cur: Math.max(s.cur - 1, 0), flow: null })),\n      nextSection: () => this.setState(s => ({ cur: Math.min(s.cur + 1, 13), flow: null })),\n      ref_root: (el) => { this.nodes.root = el; },\n    };\n\n    sections.forEach((sec, i) => {\n      const vis = !present || i === cur;\n      vals['h_' + sec.id] = vis ? sec.h : 'none';\n      vals['c_' + sec.id] = vis ? sec.c : 'none';\n      vals['navc_' + sec.id] = present && i === cur ? '#F3C032' : '#8FA1B8';\n      vals['nav_' + sec.id] = () => {\n        if (this.isPresent()) this.setState({ cur: i, flow: null });\n        else location.hash = '#' + sec.id;\n      };\n    });\n    vals.c_open = !present || cur === 13 ? 'flex' : 'none';\n\n    for (const z of zones) {\n      vals['glow_' + z] = involved.has(z);\n      vals['dim_' + z] = pairs && !involved.has(z) ? 0.35 : 1;\n      vals['ref_' + z] = (el) => { this.nodes[z] = el; };\n    }\n    for (const k of Object.keys(flowDefs)) {\n      vals['rowbg_' + k] = active === k ? '#152232' : 'transparent';\n      vals['set_' + k] = () => this.setState(s => ({ flow: s.flow === k ? null : k }));\n    }\n\n    vals.flowOverlay = this.buildOverlay(pairs, animate);\n    return vals;\n  }\n\n  buildOverlay(pairs, animate) {\n    const root = this.nodes.root;\n    if (!pairs || !root) return null;\n    const rr = root.getBoundingClientRect();\n    if (rr.width === 0) return null;\n    const els = [];\n    els.push(React.createElement('defs', { key: 'd' },\n      React.createElement('marker', { id: 'arrA', markerWidth: 10, markerHeight: 8, refX: 7, refY: 3, orient: 'auto', markerUnits: 'strokeWidth' },\n        React.createElement('path', { d: 'M0,0 L8,3 L0,6 Z', fill: '#F3C032' })),\n      React.createElement('marker', { id: 'arrB', markerWidth: 10, markerHeight: 8, refX: 7, refY: 3, orient: 'auto', markerUnits: 'strokeWidth' },\n        React.createElement('path', { d: 'M0,0 L8,3 L0,6 Z', fill: '#E14C5B' }))));\n    pairs.forEach((pair, idx) => {\n      const na = this.nodes[pair[0]], nb = this.nodes[pair[1]];\n      if (!na || !nb) return;\n      const ra = na.getBoundingClientRect(), rb = nb.getBoundingClientRect();\n      if (ra.width === 0 || rb.width === 0) return;\n      const x1 = ra.left - rr.left + ra.width / 2, y1 = ra.top - rr.top + ra.height / 2;\n      const x2 = rb.left - rr.left + rb.width / 2, y2 = rb.top - rr.top + rb.height / 2;\n      const dx = x2 - x1, dy = y2 - y1;\n      const len = Math.max(Math.hypot(dx, dy), 1);\n      const off = Math.min(90, len * 0.3);\n      const cx = (x1 + x2) / 2 - (dy / len) * off;\n      const cy = (y1 + y2) / 2 + (dx / len) * off;\n      const allow = pair[2] === 1;\n      const color = allow ? '#F3C032' : '#E14C5B';\n      els.push(React.createElement('path', {\n        key: 'p' + idx,\n        d: 'M ' + x1 + ' ' + y1 + ' Q ' + cx + ' ' + cy + ' ' + x2 + ' ' + y2,\n        fill: 'none', stroke: color, strokeWidth: 2.5, opacity: 0.9,\n        strokeDasharray: '10 7',\n        markerEnd: allow ? 'url(#arrA)' : 'url(#arrB)',\n        style: animate ? { animation: 'dashFlow 0.7s linear infinite', filter: 'drop-shadow(0 0 4px ' + color + ')' } : { filter: 'drop-shadow(0 0 4px ' + color + ')' },\n      }));\n      if (!allow) {\n        const bx = (x1 + 2 * cx + x2) / 4, by = (y1 + 2 * cy + y2) / 4;\n        els.push(React.createElement('text', {\n          key: 't' + idx, x: bx, y: by + 5, fill: '#E14C5B', fontSize: 18, fontWeight: 700,\n          textAnchor: 'middle', style: { fontFamily: \"'JetBrains Mono', monospace\" },\n        }, '✕'));\n      }\n    });\n    return React.createElement('svg', {\n      width: '100%', height: '100%',\n      viewBox: '0 0 ' + rr.width + ' ' + rr.height,\n      preserveAspectRatio: 'none',\n      style: { position: 'absolute', inset: 0, overflow: 'visible', display: 'block' },\n    }, els);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
